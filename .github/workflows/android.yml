name: Build Native APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Project Directories & Resources
      run: |
        mkdir -p app/src/main/java/com/vidofy/app
        mkdir -p app/src/main/res/values
        
        if [ -f AndroidManifest.xml ]; then
          mv AndroidManifest.xml app/src/main/
        fi
        if [ -f MainActivity.java ]; then
          mv MainActivity.java app/src/main/java/com/vidofy/app/
        fi
        if [ -f VidofyService.java ]; then
          mv VidofyService.java app/src/main/java/com/vidofy/app/
        fi

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Vidofy</string>
        </resources>
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Vidofy"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.vidofy.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.vidofy.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        gradle wrapper --gradle-version 8.5

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vidofy-debug
        path: app/build/outputs/apk/debug/app-debug.apk
